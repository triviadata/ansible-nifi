---
- name: Check if NiFi install directory exists
  ansible.builtin.stat:
    path: "{{ nifi_config_dirs.install }}/nifi-{{ nifi_version }}"
    get_attributes: false
    get_checksum: false
    get_mime: false
  register: nifi_install_dir

- name: Download NiFi binary
  ansible.builtin.get_url:
    url: "{{ download_mirror_uri }}/nifi/{{ nifi_version }}/nifi-{{ nifi_version }}-bin.zip"
    dest: "{{ nifi_config_dirs.binaries }}/nifi-{{ nifi_version }}-bin.zip"
    mode: "0644"
    checksum: "sha512:{{ download_mirror_uri }}/nifi/{{ nifi_version }}/nifi-{{ nifi_version }}-bin.zip.sha512"
  when: not nifi_install_dir.stat.exists or download_everytime

- name: Unpack NiFi binary
  ansible.builtin.unarchive:
    remote_src: true
    src: "{{ nifi_config_dirs.binaries }}/nifi-{{ nifi_version }}-bin.zip"
    dest: "{{ nifi_config_dirs.install }}/"
    owner: "{{ nifi_user }}"
    group: "{{ nifi_group }}"
  when: not nifi_install_dir.stat.exists

- name: Fix permissions
  ansible.builtin.file:
    path: "{{ nifi_config_dirs.install }}/nifi-{{ nifi_version }}"
    owner: "{{ nifi_user }}"
    group: "{{ nifi_group }}"
    recurse: true

- name: Create NiFi symlink
  ansible.builtin.file:
    src: "nifi-{{ nifi_version }}"
    path: "{{ nifi_config_dirs.home }}"
    state: "link"
    owner: "{{ nifi_user }}"
    group: "{{ nifi_group }}"
    follow: false
    force: true
